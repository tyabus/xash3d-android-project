
plugins {
    id 'com.android.application' version '8.1.0'
}

android {
    namespace 'in.celest.xash3d.hl'
    compileSdk 24

    defaultConfig {
        applicationId 'in.celest.xash3d.hl'
        minSdk 19
        targetSdk 24
        versionCode notset
        versionName '0.19.4'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation fileTree(
        dir: 'libs',
        include: ['*.jar']
    )
}
